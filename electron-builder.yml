appId: com.qvarch.assistant
productName: Qvarch Assistant
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/winprobe.ps1
    to: winprobe.ps1
  - from: resources/tablet.ps1
    to: tablet.ps1
  - from: resources/whisper
    to: whisper
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName} Setup ${version}.${ext}
portable:
  artifactName: ${productName} ${version} portable.${ext}
  # one fixed folder in %TEMP% for every run and version: Windows keys the tray icon by the exe path (a random
  # folder each run made a new 'app' in the taskbar settings), and a new version overwrites the old copy
  unpackDirName: QvarchAssistant
asar: true
# the terminal's native PTY must live outside the asar
asarUnpack:
  - "**/node_modules/@lydell/**"
