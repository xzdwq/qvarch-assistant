# The server with its database on this computer, built from the sources (to try it before publishing):
#   docker compose -f server/compose.dev.yml up --build
# The app: Настройки → Сервер и чат → адрес localhost:3000
name: qvarch-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qa
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: dev
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa"]
      interval: 3s
      timeout: 3s
      retries: 20

  transport:
    build:
      context: ..
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qa:dev@db:5432/qa
    ports:
      - "3000:3000"

volumes:
  db:
